[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vera-harness"
version = "0.1.0"
description = "Initial Telegram-to-Codex harness scaffold for Vera"
readme = "README.md"
requires-python = ">=3.9"
dependencies = []

[project.scripts]
vera-harness = "vera_harness.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
